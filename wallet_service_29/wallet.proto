syntax = "proto3";

package wallet;

service WalletService {
  rpc CreateWallet(WalletRequest) returns (WalletResponse);
}

message WalletRequest {
  string user_id = 1;
  string card_number = 2;
}

message WalletResponse {
  string wallet_id = 1;
  string status = 2;
}


service TestService {
  rpc test(TestRequest) returns (TestResponse);
}


message TestRequest {
 string id = 1;
}


message TestResponse {
  string message = 1;
}



